<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECO LIFE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #03251d;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #03251d;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 100vh;
        }

        /* --- 1. الهيدر العلوي والشعار المطابق للصورة --- */
        .header-box {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(2, 20, 15, 0.92);
            border: 1px solid rgba(209, 164, 58, 0.3);
            padding: 8px 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            width: max-content;
        }

        /* شعار الأعمدة الذهبي الكلاسيكي */
        .logo-svg {
            width: 42px;
            height: 42px;
        }

        .brand-title {
            color: #ffffff;
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 2px;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* --- 2. صورة الفيلا الكلاسيكية الفخمة --- */
        .hero-image {
            width: 100%;
            height: 380px;
            position: relative;
            overflow: hidden;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* --- 3. قسم الأزرار وخلفية الموقع --- */
        .content-section {
            padding: 25px 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background-color: #03251d;
            flex-grow: 1;
        }

        .btn-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 72px;
            border-radius: 50px;
            text-decoration: none;
            padding: 0 8px 0 22px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s ease;
            direction: ltr; /* لضمان وضع السهم يسار والدائرة يمين */
        }

        .btn-card:active {
            transform: scale(0.98);
        }

        .btn-arrow {
            font-size: 22px;
            font-weight: bold;
            width: 30px;
            text-align: left;
        }

        .btn-label {
            font-size: 19px;
            font-weight: bold;
            flex-grow: 1;
            text-align: center;
            direction: rtl;
        }

        .icon-circle {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* الزر الأول: ذهبي */
        .btn-gold {
            background: linear-gradient(135deg, #f3db83 0%, #d1a43a 100%);
            color: #03251d;
        }
        .btn-gold .btn-arrow { color: #03251d; }
        .btn-gold .icon-circle {
            background-color: #03251d;
            color: #d1a43a;
        }

        /* الزر الثاني: أبيض */
        .btn-white {
            background-color: #ffffff;
            color: #03251d;
        }
        .btn-white .btn-arrow { color: #03251d; }
        .btn-white .icon-circle {
            background-color: #03251d;
            color: #ffffff;
        }

        /* الزر الثالث: داكن بإطار ذهبي */
        .btn-dark {
            background-color: #021a14;
            border: 1.5px solid #d1a43a;
            color: #ffffff;
        }
        .btn-dark .btn-arrow { color: #ffffff; }
        .btn-dark .icon-circle {
            background-color: transparent;
            border: 1.5px solid #d1a43a;
            color: #d1a43a;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #527a6f;
            margin-top: 20px;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- الهيدر العلوي -->
        <div class="header-box">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" stroke="#d1a43a" stroke-width="2"/>
                <path d="M35 70V35M65 70V35M50 70V25" stroke="#d1a43a" stroke-width="3" stroke-linecap="round"/>
                <path d="M25 35C25 35 35 25 50 25C65 25 75 35 75 35" stroke="#d1a43a" stroke-width="2"/>
                <path d="M25 70H75" stroke="#d1a43a" stroke-width="3"/>
                <circle cx="50" cy="50" r="38" stroke="#d1a43a" stroke-width="1" stroke-dasharray="2 2"/>
            </svg>
            <span class="brand-title">DECO LIFE</span>
        </div>

        <!-- صورة الفيلا الكلاسيكية الفخمة -->
        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" alt="Deco Life Villa">
        </div>

        <!-- الأزرار -->
        <div class="content-section">
            
            <!-- 1. اتصال بالمعمل -->
            <a href="tel:+9647500000000" class="btn-card btn-gold">
                <span class="btn-arrow">←</span>
                <span class="btn-label">اتصال بالمعمل</span>
                <div class="icon-circle">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                    </svg>
                </div>
            </a>

            <!-- 2. كتالوج المنتجات -->
            <a href="https://www.dropbox.com/scl/fi/5h6uxfgf75iagejvgnhma/DECO-LIFE-SOVE-COMPANY.pdf?rlkey=k6qvgweyymlddnohqepijslaw&st=uydu7c1q&dl=0" target="_blank" class="btn-card btn-white">
                <span class="btn-arrow">←</span>
                <span class="btn-label">كتالوج المنتجات</span>
                <div class="icon-circle">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                </div>
            </a>

            <!-- 3. تيك توك -->
            <a href="https://www.tiktok.com/@jovan___.0" target="_blank" class="btn-card btn-dark">
                <span class="btn-arrow">←</span>
                <span class="btn-label">تيك توك</span>
                <div class="icon-circle">
                    <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68a6.33 6.33 0 0 0 10.83 4.48V12.2a8.21 8.21 0 0 0 4.8 1.58v-3.45a4.85 4.85 0 0 1-1.04-.15z"/>
                    </svg>
                </div>
            </a>

            <div class="footer-text">
                Decolife - 2026 © جميع الحقوق محفوظة
            </div>

        </div>

    </div>

</body>
</html>
