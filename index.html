
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECO LIFE - Jovan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #06281e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .main-container {
            width: 100%;
            max-width: 480px;
            background-color: #06281e;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* قسم الشعار في الأعلى */
        .top-header {
            padding: 20px 15px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #06281e;
        }
        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(6, 40, 30, 0.95);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1.5px solid #d4af37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            background: #d4af37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #06281e;
            font-weight: bold;
            font-size: 18px;
        }
        .brand-name {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff;
        }
        /* قسم صورة المنزل / المعمل */
        .image-section {
            width: 100%;
            height: 250px;
            overflow: hidden;
        }
        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* قسم الأزرار */
        .buttons-section {
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-grow: 1;
            justify-content: flex-start;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        /* 1. زر اتصال بالمعمل (ذهبي) */
        .btn-gold {
            background: linear-gradient(135deg, #f3e5ab, #d4af37);
            color: #06281e;
            border: none;
        }
        /* 2. زر كتالوج المنتجات (أبيض بإطار ذهبي) */
        .btn-white {
            background: #ffffff;
            color: #06281e;
            border: 1.5px solid #d4af37;
        }
        /* 3. زر تيك توك (أخضر داكن بإطار ذهبي) */
        .btn-dark {
            background: #041d15;
            color: #ffffff;
            border: 1.5px solid #d4af37;
        }
        .icon-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-gold .icon-circle {
            background: #06281e;
            color: #d4af37;
        }
        .btn-white .icon-circle {
            background: #06281e;
            color: #fff;
        }
        .btn-dark .icon-circle {
            background: #d4af37;
            color: #06281e;
        }
        .arrow-icon {
            font-size: 18px;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #7b9a90;
            padding: 10px 0 20px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- الشعار واسم الشركة في الأعلى -->
        <div class="top-header">
            <div class="brand-box">
                <div class="brand-icon">D</div>
                <div class="brand-name">DECO LIFE</div>
            </div>
        </div>

        <!-- صورة المنزل الفاخر -->
        <div class="image-section">
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" alt="Decolife Villa">
        </div>

        <!-- الأزرار الثلاثة -->
        <div class="buttons-section">
            <!-- 1. اتصال بالمعمل -->
            <a href="tel:+9647500000000" class="btn btn-gold">
                <span class="arrow-icon">←</span>

                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                </div>

            <!-- 2. كتالوج المنتجات (PDF) -->

                <span class="arrow-icon" style="color: #06281e;">←</span>
                <span style="flex-grow: 1; text-align: center;">كتالوج المنتجات</span>
                <div class="icon-circle" style="background: #06281e; color: #fff;">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
                </div>
            </a>

            <!-- 3. تيك توك -->
            <a href="https://www.tiktok.com/@jovan___.0" class="btn btn-dark" target="_blank">
                <span class="arrow-icon">←</span>
                <span style="flex-grow: 1; text-align: center;">تيك توك</span>
                <div class="icon-circle">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68a6.33 6.33 0 0 0 10.83 4.48V12.2a8.21 8.21 0 0 0 4.8 1.58v-3.45a4.85 4.85 0 0 1-1.04-.15z"/></svg>
                </div>
            </a>

            <div class="footer">
                جميع الحقوق محفوظة © 2026 - Decolife
            </div>
        </div>
    </div>
</body>
</html>
