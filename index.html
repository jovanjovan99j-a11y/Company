<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECO LIFE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            /* نفس درجة اللون الأخضر الداكن للخلفية */
            background-color: #06261d;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-wrapper {
            width: 100%;
            max-width: 480px;
            background-color: #06261d;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* --- بانر الشعار في الأعلى (نفس الصورة 12) --- */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #041913; /* لون البانر الداكن */
            display: flex;
            align-items: center;
            padding: 10px 25px;
            border-radius: 8px;
            z-index: 10;
            width: max-content;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* مكان اللوجو الدائري */
        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: contain;
            background-color: #041913;
        }

        .logo-text {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        /* --- صورة الفيلا الكلاسيكية (النصف العلوي) --- */
        .hero-section {
            width: 100%;
            height: 45vh; /* تأخذ مساحة مناسبة من الشاشة */
            min-height: 380px;
            position: relative;
        }
        .hero-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            /* تظليل خفيف من الأسفل ليدمج مع الخلفية الخضراء */
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
        }

        /* --- قسم الأزرار (النصف السفلي) --- */
        .buttons-section {
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background-color: #06261d;
            flex-grow: 1;
            z-index: 5;
            margin-top: -30px; /* لدمج الصورة مع الأزرار بنعومة */
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            height: 75px; /* زر عريض وفخم */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }

        /* ترتيب العناصر داخل الزر */
        .btn .arrow {
            font-size: 24px;
            font-weight: normal;
            width: 30px;
            text-align: left;
        }
        .btn .text {
            flex-grow: 1;
            text-align: center;
        }
        .btn .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn .icon-box svg {
            width: 24px;
            height: 24px;
        }

        /* 1. زر اتصال بالمعمل (الذهبي) */
        .btn-gold {
            background: linear-gradient(90deg, #e7cd75, #fef4bf, #e7cd75);
            color: #06261d;
        }
        .btn-gold .arrow { color: #06261d; }
        .btn-gold .icon-box {
            background-color: #06261d;
            color: #e7cd75;
        }

        /* 2. زر كتالوج المنتجات (الأبيض) */
        .btn-white {
            background-color: #ffffff;
            color: #06261d;
        }
        .btn-white .arrow { color: #06261d; }
        .btn-white .icon-box {
            background-color: #06261d;
            color: #ffffff;
        }

        /* 3. زر تيك توك (الأخضر بإطار ذهبي) */
        .btn-dark {
            background-color: #041913;
            border: 1.5px solid #e7cd75;
            color: #ffffff;
        }
        .btn-dark .arrow { color: #ffffff; }
        .btn-dark .icon-box {
            background-color: transparent;
            border: 1.5px solid #e7cd75;
            color: #e7cd75;
        }

    </style>
</head>
<body>
    <div class="mobile-wrapper">
        
        <!-- البانر العلوي (الشعار واسم الشركة) -->
        <div class="logo-container">
            <!-- ⬇️ ضع مسار أو رابط صورة الشعار الدائري الخاص بك هنا ⬇️ -->
            <img src="https://i.ibb.co/VjY8Zt8/placeholder-logo.png" alt="Deco Life Logo" class="logo-img">
            <span class="logo-text">DECO LIFE</span>
        </div>

        <!-- صورة الفيلا الكلاسيكية الفخمة -->
        <div class="hero-section">
            <!-- ⬇️ وضعت لك رابط صورة فيلا كلاسيكية قريبة جداً من صورتك، إذا عندك صورتك الأصلية ضع اسمها هنا ⬇️ -->
            <img src="https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=800&q=80" alt="Villa Background">
        </div>

        <!-- قسم الأزرار مع الروابط الخاصة بك -->
        <div class="buttons-section">
            
            <!-- 1. زر اتصال بالمعمل -->
            <a href="tel:+9647500000000" class="btn btn-gold">
                <span class="arrow">←</span>
                <span class="text">اتصال بالمعمل</span>
                <span class="icon-box">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                </span>
            </a>

            <!-- 2. زر الكتالوج -->
            <a href="https://www.dropbox.com/scl/fi/5h6uxfgf75iagejvgnhma/DECO-LIFE-SOVE-COMPANY.pdf?rlkey=k6qvgweyymlddnohqepijslaw&st=uydu7c1q&dl=0" class="btn btn-white" target="_blank">
                <span class="arrow">←</span>
                <span class="text">كتالوج المنتجات</span>
                <span class="icon-box">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </span>
            </a>

            <!-- 3. زر تيك توك -->
            <a href="https://www.tiktok.com/@jovan___.0" class="btn btn-dark" target="_blank">
                <span class="arrow">←</span>
                <span class="text">تيك توك</span>
                <span class="icon-box">
                    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68a6.33 6.33 0 0 0 10.83 4.48V12.2a8.21 8.21 0 0 0 4.8 1.58v-3.45a4.85 4.85 0 0 1-1.04-.15z"/></svg>
                </span>
            </a>

        </div>
    </div>
</body>
</html>
