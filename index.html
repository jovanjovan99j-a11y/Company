



<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECO LIFE</title>
    <!-- استدعاء خط يشبه الخط المستخدم في التصميم الأصلي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* لون الخلفية الأخضر الداكن مطابق تماماً للصورة */
            background-color: #032017;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: #032017;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- الهيدر والشعار --- */
        .header-wrapper {
            position: absolute;
            top: 25px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .header-box {
            background-color: #052c21;
            padding: 5px 25px 5px 5px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: contain;
            background-color: #000; /* خلفية سوداء للشعار كما في الصورة */
        }

        .brand-text {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1.5px;
            font-family: Arial, sans-serif;
        }

        /* --- صورة الفيلا الكلاسيكية --- */
        .hero-image-container {
            width: 100%;
            height: 380px; /* ارتفاع الصورة */
            position: relative;
        }

        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* هذا التدرج الأسود مهم جداً لدمج الصورة مع الخلفية الخضراء كما في التصميم */
        .image-gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to bottom, transparent, #032017);
        }

        /* --- قسم الأزرار --- */
        .buttons-section {
            padding: 10px 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 16px; /* المسافة بين الأزرار */
            position: relative;
            z-index: 5;
            margin-top: -20px; /* رفع الأزرار قليلاً لتتداخل مع التدرج */
        }

        .btn {
            position: relative;
            display: flex;
            justify-content: center; /* توسيط النص بدقة */
            align-items: center;
            height: 65px;
            border-radius: 35px; /* شكل الحبة الدائري */
            text-decoration: none;
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-text {
            font-size: 20px;
            font-weight: 700;
        }

        .btn-arrow {
            position: absolute;
            left: 20px;
            font-size: 24px;
            font-weight: normal;
        }

        .icon-circle {
            position: absolute;
            right: 6px;
            width: 53px;
            height: 53px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* إعدادات أيقونات SVG */
        .icon-circle svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 1. الزر الذهبي (اتصال بالمعمل) */
        .btn-gold {
            background: linear-gradient(90deg, #fce196 0%, #cca142 100%);
            color: #032017;
        }
        .btn-gold .btn-arrow { color: #032017; }
        .btn-gold .icon-circle { background-color: #032017; }
        .btn-gold .icon-circle svg { stroke: #cca142; }

        /* 2. الزر الأبيض (كتالوج المنتجات) */
        .btn-white {
            background-color: #ffffff;
            color: #032017;
        }
        .btn-white .btn-arrow { color: #032017; }
        .btn-white .icon-circle { background-color: #032017; }
        .btn-white .icon-circle svg { stroke: #ffffff; }

        /* 3. الزر الداكن (Instagram) */
        .btn-dark {
            background-color: transparent;
            border: 1.5px solid #cca142;
            color: #ffffff;
        }
        .btn-dark .btn-arrow { color: #ffffff; }
        .btn-dark .icon-circle { border: 1.5px solid #cca142; }
        .btn-dark .icon-circle svg { stroke: #ffffff; }
        
        .english-font {
            font-family: Arial, sans-serif;
            font-weight: normal;
        }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- الهيدر العلوي -->
        <div class="header-wrapper">
            <div class="header-box">
                <!-- ⚠️ ضع رابط صورة شعارك الذهبي هنا بدلاً من هذا الرابط المؤقت ⚠️ -->
                <img src="https://via.placeholder.com/50x50/000000/d6b05e?text=Logo" alt="Logo" class="logo-img">
                <span class="brand-text">DECO LIFE</span>
            </div>
        </div>

        <!-- صورة الفيلا -->
        <div class="hero-image-container">
            <!-- ⚠️ ضع رابط صورة الفيلا الكلاسيكية الفخمة الخاصة بك هنا بدلاً من هذا الرابط ⚠️ -->
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" alt="Villa">
            <div class="image-gradient-overlay"></div>
        </div>

        <!-- الأزرار -->
        <div class="buttons-section">
            
            <!-- 1. اتصال بالمعمل -->
            <a href="tel:+9647500000000" class="btn btn-gold">
                <span class="btn-arrow">←</span>
                <span class="btn-text">اتصال بالمعمل</span>
                <div class="icon-circle">
                    <!-- أيقونة الهاتف -->
                    <svg viewBox="0 0 24 24">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                </div>
            </a>

            <!-- 2. كتالوج المنتجات -->
            <a href="https://www.dropbox.com/scl/fi/5h6uxfgf75iagejvgnhma/DECO-LIFE-SOVE-COMPANY.pdf?rlkey=k6qvgweyymlddnohqepijslaw&st=uydu7c1q&dl=0" target="_blank" class="btn btn-white">
                <span class="btn-arrow">←</span>
                <span class="btn-text">كتالوج المنتجات</span>
                <div class="icon-circle">
                    <!-- أيقونة الكتالوج -->
                    <svg viewBox="0 0 24 24">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
            </a>

            <!-- 3. Instagram -->
            <a href="https://www.tiktok.com/@jovan___.0" target="_blank" class="btn btn-dark">
                <span class="btn-arrow">←</span>
                <span class="btn-text english-font">Instagram</span>
                <div class="icon-circle">
                    <!-- أيقونة انستغرام -->
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </div>
            </a>

        </div>

    </div>

</body>
</html>
