<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسم شركتك - الصفحة الرسمية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <!-- Background Decorative Glows -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-72 h-72 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Container -->
    <main class="w-full max-w-md glass-card rounded-3xl p-8 glow-effect relative z-10 text-center shadow-2xl">
        
        <!-- Logo / Avatar -->
        <div class="relative w-28 h-28 mx-auto mb-6">
            <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-full animate-pulse blur-sm"></div>
            <div class="relative w-full h-full bg-gray-900 rounded-full border-2 border-indigo-500/50 flex items-center justify-center text-3xl font-bold text-indigo-400">
                ش
            </div>
        </div>

        <!-- Company Name & Bio -->
        <h1 class="text-2xl font-black tracking-wide text-white mb-2">[اسم شركتك]</h1>
        <p class="text-gray-400 text-sm mb-8 leading-relaxed">
            نقدم أفضل الخدمات والحلول التجارية المبتكرة. تواصل معنا أو استعرض ملفنا التعريفي بكل سهولة.
        </p>

        <!-- Action Links Buttons -->
        <div class="space-y-4">
            
            <!-- Instagram Button -->
            <a href="https://instagram.com/your_username" target="_blank" 
               class="flex items-center justify-between w-full p-4 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 text-white font-semibold shadow-lg hover:opacity-95 transition-all transform hover:-translate-y-0.5">
                <span class="flex items-center gap-3">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    <span>تابعنا على إنستغرام</span>
                </span>
                <svg class="w-5 h-5 rtl:rotate-180" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <!-- Phone Call Button -->
            <a href="tel:+9647500000000" 
               class="flex items-center justify-between w-full p-4 rounded-2xl bg-gray-800/80 hover:bg-gray-800 border border-gray-700/50 text-white font-semibold transition-all transform hover:-translate-y-0.5">
                <span class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                    </div>
                    <span class="text-gray-200">اتصل بنا مباشرة</span>
                </span>
                <span class="text-sm text-emerald-400 font-mono" dir="ltr">+964 750 000 0000</span>
            </a>

            <!-- PDF File Button (Opens Modal or Direct Download) -->
            <button onclick="openPdfModal()" 
                    class="flex items-center justify-between w-full p-4 rounded-2xl bg-gray-800/80 hover:bg-gray-800 border border-gray-700/50 text-white font-semibold transition-all transform hover:-translate-y-0.5 cursor-pointer">
                <span class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    </div>
                    <span class="text-gray-200">ملف التعريف (PDF)</span>
                </span>
                <span class="text-xs px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300">عرض وتحميل</span>
            </button>

        </div>

        <!-- Footer -->
        <footer class="mt-8 text-xs text-gray-500">
            جميع الحقوق محفوظة &copy; 2026
        </footer>
    </main>

    <!-- PDF Modal (Popup when clicking PDF) -->
    <div id="pdfModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-md rounded-3xl p-6 border border-gray-700 text-center relative animate-fade-in">
            <button onclick="closePdfModal()" class="absolute top-4 left-4 text-gray-400 hover:text-white bg-gray-800 p-2 rounded-full">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <h3 class="text-lg font-bold text-white mb-3">ملف الشركة التعريفي</h3>
            <p class="text-sm text-gray-400 mb-6">يمكنك اختيار فتح الملف مباشرة أو تحميله على جهازك.</p>
            
            <div class="flex gap-3">
                <a href="your_file.pdf" target="_blank" class="flex-1 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition-all text-center">
                    تصفح الملف
                </a>
                <a href="your_file.pdf" download class="flex-1 py-3 px-4 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-200 font-medium text-sm transition-all text-center border border-gray-700">
                    تحميل PDF
                </a>
            </div>
        </div>
    </div>

    <!-- Script for Modal Interactivity -->
    <script>
        function openPdfModal() {
            document.getElementById('pdfModal').classList.remove('hidden');
        }
        function closePdfModal() {
            document.getElementById('pdfModal').classList.add('hidden');
        }
        // Close modal when clicking outside
        window.onclick = function(event) {
            let modal = document.getElementById('pdfModal');
            if (event.target == modal) {
                closePdfModal();
            }
        }
    </script>
</body>
</html>
