<!DOCTYPE html>

<head>

    <title>Jovan</title>
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #13182a; width: 100%; max-width: 400px; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center; border: 1px solid rgba(255,255,255,0.06); }
        .avatar { width: 85px; height: 85px; background: linear-gradient(135deg, #4f46e5, #9333ea); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: bold; color: #fff; margin: 0 auto 20px; box-shadow: 0 0 20px rgba(79,70,229,0.4); }

        p { font-size: 14px; color: #9ca3af; margin-bottom: 25px; line-height: 1.6; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #1e2640; color: #fff; text-decoration: none; padding: 15px; border-radius: 14px; margin-bottom: 15px; font-weight: bold; transition: 0.3s; border: 1px solid rgba(255,255,255,0.08); font-size: 15px; }
        .btn.tiktok { background: #000000; border-color: #25f4ee; color: #fff; }
        .btn:hover { opacity: 0.95; transform: translateY(-2px); }
        .footer { margin-top: 25px; font-size: 12px; color: #6b7280; }

</head>
